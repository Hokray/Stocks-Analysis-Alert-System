name: Daily Stock Screener

on:
  # Manual trigger - gives you a "Run workflow" button in the Actions tab.
  # Keep this forever; it's how you test without waiting a day.
  workflow_dispatch:

  # 21:15 UTC. The cron is an anchor, not the real start time -- GitHub
  # scheduled runs here land 2-3.5h late, so this executes around 23:20-00:00
  # UTC. That window produced complete bars for two weeks; moving to 22:00
  # pushed execution to ~01:20 UTC, where the provider returned trailing rows
  # with no close and the screener silently matched nothing for four days.
  schedule:
    - cron: '15 21 * * 1-5'

# Needed so the workflow can commit alerts_history.json back to the repo.
permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
        
      - name: Run tests
        run: pytest -q

      - name: Run the screener
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SEND_EMAIL: 'true'
        run: python screener.py

      # The runner is wiped after every run, so both the dedup file and the
      # run log have to be committed back or the state is lost. if: always()
      # means a crashed run still records that it failed.
      - name: Persist alerts history, run log and snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alerts_history.json run_log.json data/snapshots/
          if git diff --staged --quiet; then
            echo "Nothing new to record."
          else
            git commit -m "Update alerts history, run log and daily snapshot [skip ci]"
            git push
          fi

      # Keeps the last run's full diagnostic table downloadable from the
      # Actions run page, without committing it to the repo.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-results
          path: last_run_results.csv
          retention-days: 30